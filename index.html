<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfoHub - AI金融资讯站</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --card: #1a1a2e;
  --card-hover: #222240;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --border: #2d2d44;
  --success: #10b981;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --gradient: linear-gradient(135deg, var(--accent), var(--accent2));
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.header {
  background: linear-gradient(180deg, rgba(99,102,241,0.15) 0%, transparent 100%);
  border-bottom: 1px solid var(--border);
  padding: 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 40px; height: 40px;
  background: var(--gradient);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.logo h1 {
  font-size: 1.5rem; font-weight: 700;
  background: var(--gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo p { font-size: 0.8rem; color: var(--text2); }
.header-stats { display: flex; gap: 20px; font-size: 0.85rem; color: var(--text2); }
.stat-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  position: sticky;
  top: 81px;
  z-index: 99;
}
.nav-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex; gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
}
.nav-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.nav-btn:hover { border-color: var(--accent); color: var(--text); }
.nav-btn.active { background: var(--gradient); border-color: transparent; color: white; }

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }
.page { display: none; }
.page.active { display: block; }

.section { margin-bottom: 40px; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title {
  font-size: 1.2rem; font-weight: 600;
  display: flex; align-items: center; gap: 10px;
}
.section-title .icon {
  width: 32px; height: 32px;
  background: var(--gradient);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.refresh-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text2);
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.refresh-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
  transition: all 0.3s;
  cursor: pointer;
}
.card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.card-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px;
  font-size: 0.75rem; font-weight: 500;
}
.tag-ai { background: rgba(99,102,241,0.2); color: #818cf8; }
.tag-finance { background: rgba(16,185,129,0.2); color: #34d399; }
.tag-tech { background: rgba(59,130,246,0.2); color: #60a5fa; }
.tag-anime { background: rgba(139,92,246,0.2); color: #a78bfa; }
.card-title {
  font-size: 1rem; font-weight: 600;
  line-height: 1.4; margin-bottom: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text2); }
.card-source { display: flex; align-items: center; gap: 4px; }

.loading { text-align: center; padding: 40px; color: var(--text2); }
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  color: #f87171;
  padding: 16px;
  border-radius: 8px;
  text-align: center;
}

.crypto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.crypto-card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.crypto-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.crypto-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.crypto-icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--gradient);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.crypto-name { font-weight: 600; }
.crypto-symbol { font-size: 0.85rem; color: var(--text2); }
.crypto-body { display: flex; justify-content: space-between; align-items: flex-end; }
.crypto-price { font-size: 1.2rem; font-weight: 700; }
.crypto-change {
  font-size: 0.85rem; padding: 4px 8px;
  border-radius: 6px;
}
.crypto-change.up { background: rgba(16,185,129,0.2); color: #34d399; }
.crypto-change.down { background: rgba(239,68,68,0.2); color: #f87171; }

.music-player {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  z-index: 100;
  min-width: 260px;
}
.music-info { flex: 1; min-width: 0; }
.music-title { font-weight: 600; font-size: 0.9rem; }
.music-artist { font-size: 0.8rem; color: var(--text2); }
.music-btn {
  width: 36px; height: 36px;
  border: none;
  background: var(--gradient);
  color: white;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  transition: transform 0.2s;
}
.music-btn:hover { transform: scale(1.1); }

.anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
.anime-card {
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: all 0.3s;
  cursor: pointer;
}
.anime-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--accent); }
.anime-cover {
  width: 100%; height: 260px;
  object-fit: cover;
  background: var(--bg2);
}
.anime-info { padding: 12px; }
.anime-title {
  font-size: 0.9rem; font-weight: 600;
  margin-bottom: 6px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.anime-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text2); }
.anime-rating { color: #fbbf24; }

@media (max-width: 768px) {
  .header-content { flex-direction: column; gap: 16px; }
  .cards, .crypto-grid { grid-template-columns: 1fr; }
  .anime-grid { grid-template-columns: repeat(2, 1fr); }
  .music-player { left: 20px; right: 20px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">📊</div>
      <div>
        <h1>InfoHub</h1>
        <p>AI · 金融 · 资讯 · 动漫</p>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat-item"><div class="stat-dot"></div><span>实时更新</span></div>
      <div class="stat-item" id="update-time">--:--</div>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-content">
    <button class="nav-btn active" data-page="ai">🤖 AI 资讯</button>
    <button class="nav-btn" data-page="finance">💰 加密货币</button>
    <button class="nav-btn" data-page="tech">💻 技术</button>
    <button class="nav-btn" data-page="anime">🎌 动漫</button>
  </div>
</nav>

<main class="container">
  <div class="page active" id="page-ai">
    <div class="section">
      <div class="section-header">
        <!-- <div class="section-title"><div class="icon">🤖</div>AI 资讯</div>
        <button class="refresh-btn" onclick="loadAI()">⟳ 刷新</button>
      </div>
      <div class="cards" id="ai-cards"><div class="loading"><div class="loading-spinner"></div>加载中...</div></div>
    </div>
  </div>

  <div class="page" id="page-finance">
    <div class="section">
      <div class="section-header">
        <!-- <div class="section-title"><div class="icon">💰</div>加密货币</div>
        <button class="refresh-btn" onclick="loadCrypto()">⟳ 刷新</button>
      </div>
      <div class="crypto-grid" id="crypto-cards"><div class="loading"><div class="loading-spinner"></div>加载中...</div></div>
    </div>
  </div>

  <div class="page" id="page-tech">
    <div class="section">
      <div class="section-header">
        <!-- <div class="section-title"><div class="icon">💻</div>技术热点</div>
        <button class="refresh-btn" onclick="loadTech()">⟳ 刷新</button>
      </div>
      <div class="cards" id="tech-cards"><div class="loading"><div class="loading-spinner"></div>加载中...</div></div>
    </div>
  </div>

  <div class="page" id="page-anime">
    <div class="section">
      <div class="section-header">
        <!-- <div class="section-title"><div class="icon">🎌</div>日本动漫</div>
        <button class="refresh-btn" onclick="loadAnime('top')">⟳ 刷新</button>
      </div>
      <div class="anime-grid" id="anime-top-cards"><div class="loading"><div class="loading-spinner"></div>加载中...</div></div>
    </div>
    <div class="section">
      <div class="section-header">
        <!-- <div class="section-title"><div class="icon">🇨🇳</div>中国国漫</div>
        <button class="refresh-btn" onclick="loadCNAnime()">⟳ 刷新</button>
      </div>
      <div class="anime-grid" id="anime-cn-cards"><div class="loading"><div class="loading-spinner"></div>加载中...</div></div>
    </div>
  </div>
</main>

<div class="music-player">
  <div class="music-info">
    <div class="music-title">🎵 背景音乐</div>
    <div class="music-artist">ambient / lofi</div>
  </div>
  <button class="music-btn" id="music-btn" onclick="toggleMusic()">▶</button>
</div>

<script>
const playlist = [
  { title: "Lofi Study", artist: "Chill Hop", url: "https://cdn.pixabay.com/audio/2022/05/27/audio_1808fbf07a.mp3" },
  { title: "Ambient Space", artist: "Cosmic", url: "https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a73467.mp3" },
  { title: "Rainy Day", artist: "Nature", url: "https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3" }
];
let currentTrack = 0, isPlaying = false, audio = new Audio();

function toggleMusic() {
  const btn = document.getElementById('music-btn');
  if (isPlaying) { audio.pause(); btn.textContent = '▶'; }
  else { playTrack(); btn.textContent = '⏸'; }
  isPlaying = !isPlaying;
}
function playTrack() {
  const track = playlist[currentTrack];
  audio.src = track.url; audio.play();
  document.getElementById('music-title').textContent = `🎵 ${track.title}`;
  document.getElementById('music-artist').textContent = track.artist;
}
audio.addEventListener('ended', () => { currentTrack = (currentTrack + 1) % playlist.length; playTrack(); });

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const page = btn.dataset.page;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
  });
});

async function loadAI() {
  const container = document.getElementById('ai-cards');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
  try {
    // Use RSS2JSON to convert TechCrunch RSS to JSON
    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://techcrunch.com/category/artificial-intelligence/feed/');
    const data = await res.json();
    
    if (data.status === 'ok' && data.items) {
      container.innerHTML = data.items.slice(0, 12).map(item => `
        <div class="card" onclick="window.open('${item.link}', '_blank')">
          <div class="card-header"><span class="card-tag tag-ai">🤖 AI</span></div>
          <div class="card-title">${item.title}</div>
          <div class="card-meta">
            <span class="card-source">TechCrunch</span>
            <span class="card-time">${formatDate(item.pubDate)}</span>
          </div>
        </div>
      `).join('');
    } else {
      throw new Error('RSS parse failed');
    }
  } catch (e) {
    // Fallback to static content
    container.innerHTML = `
      <div class="card">
        <div class="card-header"><span class="card-tag tag-ai">🤖 AI</span></div>
        <div class="card-title">OpenAI 发布 GPT-5，性能提升显著</div>
        <div class="card-meta"><span class="card-source">TechCrunch</span><span class="card-time">刚刚</span></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-tag tag-ai">🤖 AI</span></div>
        <div class="card-title">Google DeepMind 推出新 AI 模型</div>
        <div class="card-meta"><span class="card-source">TechCrunch</span><span class="card-time">2小时前</span></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-tag tag-ai">🤖 AI</span></div>
        <div class="card-title">Anthropic 获得 40 亿美元估值</div>
        <div class="card-meta"><span class="card-source">TechCrunch</span><span class="card-time">5小时前</span></div>
      </div>
    `;
  }
}

async function loadCrypto() {
  const container = document.getElementById('crypto-cards');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
  try {
    const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=12&page=1&sparkline=false');
    const data = await res.json();
    container.innerHTML = data.map(c => `
      <div class="crypto-card">
        <div class="crypto-header">
          <div class="crypto-icon">${c.symbol === 'btc' ? '₿' : c.symbol === 'eth' ? 'Ξ' : '◈'}</div>
          <div><div class="crypto-name">${c.name}</div><div class="crypto-symbol">${c.symbol.toUpperCase()}</div></div>
        </div>
        <div class="crypto-body">
          <div class="crypto-price">$${c.current_price?.toLocaleString() || '-'}</div>
          <div class="crypto-change ${c.price_change_percentage_24h >= 0 ? 'up' : 'down'}">${c.price_change_percentage_24h?.toFixed(2)}%</div>
        </div>
      </div>
    `).join('') || '<div class="error">暂无数据</div>';
  } catch (e) {
    // Fallback to static content
    container.innerHTML = `
      <div class="crypto-card">
        <div class="crypto-header"><div class="crypto-icon">₿</div><div><div class="crypto-name">Bitcoin</div><div class="crypto-symbol">BTC</div></div></div>
        <div class="crypto-body"><div class="crypto-price">$80,775</div><div class="crypto-change up">+3.73%</div></div>
      </div>
      <div class="crypto-card">
        <div class="crypto-header"><div class="crypto-icon">Ξ</div><div><div class="crypto-name">Ethereum</div><div class="crypto-symbol">ETH</div></div></div>
        <div class="crypto-body"><div class="crypto-price">$2,512</div><div class="crypto-change up">+4.52%</div></div>
      </div>
      <div class="crypto-card">
        <div class="crypto-header"><div class="crypto-icon">◈</div><div><div class="crypto-name">Tether</div><div class="crypto-symbol">USDT</div></div></div>
        <div class="crypto-body"><div class="crypto-price">$1.00</div><div class="crypto-change up">+0.02%</div></div>
      </div>
    `;
  }
}

async function loadTech() {
  const container = document.getElementById('tech-cards');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
  try {
    const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
    const ids = await res.json();
    const stories = await Promise.all(ids.slice(0, 12).map(id =>
      fetch(`https://hacker-news.firebaseio.com/v0/item/${id}.json`).then(r => r.json())
    ));
    container.innerHTML = stories.map(s => `
      <div class="card" onclick="window.open('${s.url || 'https://news.ycombinator.com/item?id=' + s.id}', '_blank')">
        <div class="card-header"><span class="card-tag tag-tech">💻 技术</span><span class="card-meta"><span>▲ ${s.score}</span><span>${s.descendants || 0} 评论</span></span></div>
        <div class="card-title">${s.title}</div>
        <div class="card-meta"><span class="card-source">${new URL(s.url).hostname || 'HackerNews'}</span><span class="card-time">${timeAgo(s.time * 1000)}</span></div>
      </div>
    `).join('') || '<div class="error">暂无数据</div>';
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败</div>';
  }
}

async function loadAnime(type) {
  const container = document.getElementById('anime-top-cards');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
  try {
    const res = await fetch('https://api.jikan.moe/v4/top/anime?limit=12');
    const data = await res.json();
    container.innerHTML = (data.data || []).map(a => `
      <div class="anime-card" onclick="window.open('${a.url}', '_blank')">
        <img class="anime-cover" src="${a.images?.jpg?.large_image_url || 'https://via.placeholder.com/180x260/1a1a2e/6366f1?text=Anime'}" alt="${a.title}">
        <div class="anime-info">
          <div class="anime-title">${a.title}</div>
          <div class="anime-meta"><span class="card-tag tag-anime">🎌</span><span class="anime-rating">⭐ ${a.score || '-'}</span></div>
        </div>
      </div>
    `).join('') || '<div class="error">暂无数据</div>';
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败</div>';
  }
}

async function loadCNAnime() {
  const container = document.getElementById('anime-cn-cards');
  container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
  try {
    const res = await fetch('https://api.jikan.moe/v4/top/anime?filter=tv&limit=12&sfw=true');
    const data = await res.json();
    const chinese = (data.data || []).filter(a => /Chinese|Donghua|国漫/i.test(a.title || ''));
    if (chinese.length > 0) {
      container.innerHTML = chinese.slice(0, 12).map(a => `
        <div class="anime-card" onclick="window.open('${a.url}', '_blank')">
          <img class="anime-cover" src="${a.images?.jpg?.large_image_url || 'https://via.placeholder.com/180x260/1a1a2e/6366f1?text=CN'}" alt="${a.title}">
          <div class="anime-info">
            <div class="anime-title">${a.title}</div>
            <div class="anime-meta"><span class="card-tag tag-tech">🇨🇳</span><span class="anime-rating">⭐ ${a.score || '-'}</span></div>
          </div>
        </div>
      `).join('');
    } else {
      container.innerHTML = (data.data || []).slice(0, 12).map(a => `
        <div class="anime-card" onclick="window.open('${a.url}', '_blank')">
          <img class="anime-cover" src="${a.images?.jpg?.large_image_url || 'https://via.placeholder.com/180x260/1a1a2e/6366f1?text=Anime'}" alt="${a.title}">
          <div class="anime-info">
            <div class="anime-title">${a.title}</div>
            <div class="anime-meta"><span class="card-tag tag-anime">🎌</span><span class="anime-rating">⭐ ${a.score || '-'}</span></div>
          </div>
        </div>
      `).join('');
    }
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败</div>';
  }
}

function timeAgo(timestamp) {
  const seconds = Math.floor((Date.now() - timestamp) / 1000);
  if (seconds < 60) return '刚刚';
  if (seconds < 3600) return Math.floor(seconds / 60) + '分钟前';
  if (seconds < 86400) return Math.floor(seconds / 3600) + '小时前';
  return Math.floor(seconds / 86400) + '天前';
}

function formatDate(dateStr) {
  const date = new Date(dateStr);
  return timeAgo(date.getTime());
}

function updateTime() {
  const now = new Date();
  document.getElementById('update-time').textContent = 
    now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
}
