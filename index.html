<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资讯主页</title>
<style>
:root {
  --bg: #09090b;
  --bg2: #0f0f14;
  --card: #18181b;
  --card-hover: #1f1f23;
  --text: #fafafa;
  --text2: #a1a1aa;
  --text3: #71717a;
  --accent: #8b5cf6;
  --accent2: #6366f1;
  --accent3: #ec4899;
  --border: #27272a;
  --border2: #3f3f46;
  --success: #10b981;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
  --glass: rgba(24,24,27,0.8);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Header */
.header {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.logo { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(139,92,246,0.3);
}
.logo h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo p { font-size: 0.75rem; color: var(--text3); }

.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  transition: all 0.2s;
}
.search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
.search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.5; }

.header-stats { display: flex; align-items: center; gap: 16px; font-size: 0.85rem; color: var(--text2); flex-shrink: 0; }
.stat-item { display: flex; align-items: center; gap: 6px; }
.stat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.7;transform:scale(1.2)} }

/* Nav */
.nav {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  position: sticky;
  top: 68px;
  z-index: 99;
}
.nav-content {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  gap: 4px;
  padding: 8px 0;
}
.nav-btn {
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: all 0.2s;
  position: relative;
  white-space: nowrap;
}
.nav-btn::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent3));
  transition: all 0.3s;
  transform: translateX(-50%);
  border-radius: 1px;
}
.nav-btn:hover { color: var(--text); background: rgba(139,92,246,0.1); }
.nav-btn.active { color: var(--text); background: rgba(139,92,246,0.15); }
.nav-btn.active::after { width: 60%; }

/* Sub nav for anime */
.sub-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.sub-nav-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text2);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
}
.sub-nav-btn:hover { border-color: var(--accent); color: var(--text); }
.sub-nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent3)); border-color: transparent; color: white; }

/* Container */
.container { max-width: 1400px; margin: 0 auto; padding: 24px; }
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.section { margin-bottom: 40px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.section-title .icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent3)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }

.refresh-btn {
  padding: 8px 16px;
  border: 1px solid var(--border2);
  background: var(--card);
  color: var(--text2);
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.refresh-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
.refresh-btn.loading .refresh-icon { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.card {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  opacity: 0;
  animation: cardIn 0.4s ease forwards;
  display: flex;
  flex-direction: column;
}
.card:hover { transform: translateY(-6px); border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 1px var(--accent); }
@keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.card-image {
  width: 100%;
  height: 160px;
  object-fit: cover;
  background: linear-gradient(135deg, var(--bg2), var(--card));
  display: block;
  flex-shrink: 0;
}
.card-image-placeholder {
  width: 100%;
  height: 160px;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
  opacity: 0.8;
  flex-shrink: 0;
}
.card-content { padding: 16px; flex: 1; display: flex; flex-direction: column; }
.card-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; margin-bottom: 10px; align-self: flex-start; }
.tag-news { background: rgba(139,92,246,0.2); color: #a78bfa; }
.tag-tech { background: rgba(99,102,241,0.2); color: #818cf8; }
.tag-anime { background: rgba(236,72,153,0.2); color: #f472b6; }
.card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text3); margin-top: auto; }
.card-source { display: flex; align-items: center; gap: 6px; }
.card-source::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, var(--card) 25%, var(--card-hover) 50%, var(--card) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skeleton-card { display: flex; flex-direction: column; gap: 12px; }
.skeleton-image { height: 160px; border-radius: 12px 12px 0 0; }
.skeleton-line { height: 14px; border-radius: 4px; }
.skeleton-line:nth-child(2) { width: 80%; }
.skeleton-line:nth-child(3) { width: 60%; margin-top: 8px; }

/* Anime Grid */
.anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
.anime-card {
  background: var(--card);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid var(--border);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  position: relative;
  opacity: 0;
  animation: cardIn 0.4s ease forwards;
}
.anime-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--shadow); border-color: var(--accent); }
.anime-cover { width: 100%; height: 220px; object-fit: cover; background: var(--bg2); display: block; }
.anime-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
  opacity: 0;
  transition: opacity 0.3s;
}
.anime-card:hover .anime-overlay { opacity: 1; }
.anime-info { padding: 12px; }
.anime-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anime-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: var(--text3); }
.anime-rating { color: #fbbf24; font-weight: 600; }
.anime-rank { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; z-index: 1; }

/* Music Player */
.music-player {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 14px 18px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 100;
  min-width: 320px;
  transition: all 0.3s;
}
.music-player:hover { border-color: var(--accent); }
.music-info { flex: 1; min-width: 0; }
.music-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.music-artist { font-size: 0.7rem; color: var(--text3); }
.music-controls { display: flex; align-items: center; gap: 6px; }
.music-btn-sm {
  width: 32px;
  height: 32px;
  border: none;
  background: var(--bg2);
  color: var(--text2);
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.music-btn-sm:hover { background: var(--accent); color: white; }
.music-btn {
  width: 40px;
  height: 40px;
  border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent3));
  color: white;
  border-radius: 50%;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(139,92,246,0.4);
}
.music-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px rgba(139,92,246,0.5); }
.music-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--border);
  border-radius: 0 0 20px 20px;
  overflow: hidden;
}
.music-progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3)); width: 0%; transition: width 0.3s; }

/* Back to top */
.back-to-top {
  position: fixed;
  bottom: 100px;
  right: 24px;
  width: 40px;
  height: 40px;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.3s;
  z-index: 99;
  color: var(--text2);
  font-size: 1.2rem;
}
.back-to-top.show { opacity: 1; transform: translateY(0); }
.back-to-top:hover { background: var(--accent); color: white; border-color: var(--accent); }

/* Error / Empty */
.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #f87171; padding: 24px; border-radius: 12px; text-align: center; grid-column: 1 / -1; }
.empty { color: var(--text3); text-align: center; padding: 40px; grid-column: 1 / -1; font-size: 0.9rem; }

/* Responsive */
@media (max-width: 768px) {
  .header-content { flex-wrap: wrap; }
  .search-box { order: 3; max-width: 100%; flex-basis: 100%; }
  .cards { grid-template-columns: 1fr; }
  .anime-grid { grid-template-columns: repeat(2, 1fr); }
  .music-player { left: 16px; right: 16px; min-width: unset; }
  .back-to-top { right: 16px; bottom: 90px; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <div>
        <h1>资讯主页</h1>
        <p>实时资讯 & 动漫</p>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="搜索资讯...">
    </div>
    <div class="header-stats">
      <div class="stat-item"><div class="stat-dot"></div><span>在线</span></div>
      <div id="update-time">--:--</div>
    </div>
  </div>
</header>

<nav class="nav">
  <div class="nav-content">
    <button class="nav-btn active" data-page="news">📰 资讯</button>
    <button class="nav-btn" data-page="tech">💻 技术</button>
    <button class="nav-btn" data-page="anime">🎌 动漫</button>
  </div>
</nav>

<main class="container">
  <div class="page active" id="page-news">
    <div class="section">
      <div class="section-header">
        <div class="section-title"><span class="icon">📰</span>资讯</div>
        <button class="refresh-btn" onclick="loadNews(this)"><span class="refresh-icon">⟳</span> 刷新</button>
      </div>
      <div class="cards" id="news-cards"></div>
    </div>
  </div>

  <div class="page" id="page-tech">
    <div class="section">
      <div class="section-header">
        <div class="section-title"><span class="icon">💻</span>技术</div>
        <button class="refresh-btn" onclick="loadTech(this)"><span class="refresh-icon">⟳</span> 刷新</button>
      </div>
      <div class="cards" id="tech-cards"></div>
    </div>
  </div>

  <div class="page" id="page-anime">
    <div class="section">
      <div class="section-header">
        <div class="section-title"><span class="icon">🎌</span>动漫</div>
        <button class="refresh-btn" onclick="loadAnime(this)"><span class="refresh-icon">⟳</span> 刷新</button>
      </div>
      <div class="sub-nav" id="anime-sub-nav">
        <button class="sub-nav-btn active" data-type="season">🔥 新番连载</button>
        <button class="sub-nav-btn" data-type="top">🏆 排行榜</button>
        <button class="sub-nav-btn" data-type="random">🎲 随机推荐</button>
      </div>
      <div class="anime-grid" id="anime-cards"></div>
    </div>
  </div>
</main>

<div class="music-player">
  <div class="music-info">
    <div class="music-title" id="music-title">🎵 背景音乐</div>
    <div class="music-artist" id="music-artist">点击播放</div>
  </div>
  <div class="music-controls">
    <button class="music-btn-sm" onclick="prevTrack()" title="上一首">⏮</button>
    <button class="music-btn" id="music-btn" onclick="toggleMusic()">▶</button>
    <button class="music-btn-sm" onclick="nextTrack()" title="下一首">⏭</button>
  </div>
  <div class="music-progress"><div class="music-progress-bar" id="music-progress"></div></div>
</div>

<button class="back-to-top" id="back-to-top" onclick="scrollToTop()">↑</button>

<script>
// ========== 音乐播放器 ==========
// 16首免费音乐（SoundHelix）
const allSongs = Array.from({length: 16}, (_, i) => ({
  title: `SoundHelix ${i + 1}`,
  artist: 'SoundHelix',
  url: `https://www.soundhelix.com/examples/mp3/SoundHelix-Song-${i + 1}.mp3`
}));
// 半天换一批：上午(0-12点)前8首，下午(12-24点)后8首
const hour = new Date().getHours();
const startIdx = hour < 12 ? 0 : 8;
let playlist = allSongs.slice(startIdx, startIdx + 8);
playlist.sort(() => Math.random() - 0.5);
let currentTrack = 0;
let isPlaying = false;
let audio = new Audio();

function toggleMusic() {
  const btn = document.getElementById('music-btn');
  if (isPlaying) {
    audio.pause();
    btn.textContent = '▶';
    isPlaying = false;
  } else {
    playTrack();
    btn.textContent = '⏸';
    isPlaying = true;
  }
}

function playTrack() {
  const track = playlist[currentTrack];
  audio.src = track.url;
  audio.play().catch(e => console.warn('播放失败:', e));
  document.getElementById('music-title').textContent = `🎵 ${track.title}`;
  document.getElementById('music-artist').textContent = track.artist;
}

function nextTrack() {
  currentTrack = (currentTrack + 1) % playlist.length;
  playTrack();
  if (!isPlaying) {
    document.getElementById('music-btn').textContent = '⏸';
    isPlaying = true;
  }
}

function prevTrack() {
  currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
  playTrack();
  if (!isPlaying) {
    document.getElementById('music-btn').textContent = '⏸';
    isPlaying = true;
  }
}

audio.addEventListener('ended', () => {
  nextTrack();
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const progress = (audio.currentTime / audio.duration) * 100;
    document.getElementById('music-progress').style.width = progress + '%';
  }
});

// ========== 导航 ==========
let currentPage = 'news';
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.page).classList.add('active');
    currentPage = btn.dataset.page;
    document.getElementById('search-input').value = '';
  });
});

// ========== 回到顶部 ==========
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-to-top');
  btn.classList.toggle('show', window.scrollY > 300);
});
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ========== 工具函数 ==========
function timeAgo(timestamp) {
  const seconds = Math.floor((Date.now() - timestamp) / 1000);
  if (seconds < 60) return '刚刚';
  if (seconds < 3600) return Math.floor(seconds / 60) + '分钟前';
  if (seconds < 86400) return Math.floor(seconds / 3600) + '小时前';
  return Math.floor(seconds / 86400) + '天前';
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  return isNaN(date.getTime()) ? '' : timeAgo(date.getTime());
}

function getDomain(url) {
  try { return new URL(url).hostname; } catch { return ''; }
}

function getFavicon(sourceUrl) {
  const domain = getDomain(sourceUrl);
  return domain ? `https://www.google.com/s2/favicons?domain=${domain}&sz=128` : '';
}

function getImage(item, sourceUrl) {
  let img = '';
  // 1. 直接字段
  if (item.thumbnail) img = item.thumbnail;
  else if (item.enclosure) {
    if (Array.isArray(item.enclosure) && item.enclosure.length > 0) img = item.enclosure[0].link || item.enclosure[0].url;
    else if (typeof item.enclosure === 'object') img = item.enclosure.link || item.enclosure.url;
    else img = item.enclosure;
  }
  else if (item.media) {
    img = item.media.thumbnail || item.media.content?.url || item.media.url || '';
  }
  // 2. 从content/description提取img
  if (!img) {
    const html = item.content || item.description || '';
    const match = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (match) img = match[1];
  }
  if (!img) return '';
  // 3. 相对路径补全域名
  if (img.startsWith('/') && sourceUrl) {
    try { img = new URL(sourceUrl).origin + img; } catch {}
  }
  // 4. 用图片代理解决防盗链
  if (img.startsWith('http')) {
    img = 'https://images.weserv.nl/?url=' + encodeURIComponent(img.replace(/^https?:\/\//, ''));
  }
  return img;
}

function withTimeout(promise, ms = 8000) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

function renderSkeleton(container, count = 6, type = 'card') {
  if (type === 'anime') {
    container.innerHTML = Array(count).fill('<div class="skeleton skeleton-card"><div class="skeleton skeleton-image" style="height:220px"></div><div class="skeleton skeleton-line"></div></div>').join('');
  } else {
    container.innerHTML = Array(count).fill('<div class="skeleton skeleton-card"><div class="skeleton skeleton-image"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div></div>').join('');
  }
}

// ========== 全局数据存储（用于搜索） ==========
let currentNewsItems = [];
let currentTechItems = [];

// ========== 搜索功能 ==========
document.getElementById('search-input').addEventListener('input', function(e) {
  const keyword = e.target.value.trim().toLowerCase();
  if (currentPage === 'news') {
    renderNewsCards(keyword ? currentNewsItems.filter(i => i.title.toLowerCase().includes(keyword) || i.source.toLowerCase().includes(keyword)) : currentNewsItems);
  } else if (currentPage === 'tech') {
    renderTechCards(keyword ? currentTechItems.filter(i => i.title.toLowerCase().includes(keyword) || i.source.toLowerCase().includes(keyword)) : currentTechItems);
  }
});

// ========== 渲染卡片 ==========
function renderNewsCards(items) {
  const container = document.getElementById('news-cards');
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">未找到相关资讯</div>';
    return;
  }
  container.innerHTML = items.slice(0, 12).map((item, i) => {
    const img = getImage(item, item.sourceUrl);
    const favicon = getFavicon(item.sourceUrl);
    const displayImg = img || favicon;
    return `
      <div class="card" onclick="window.open('${item.link || '#'}', '_blank')" style="animation-delay: ${i * 0.05}s">
        ${displayImg ? `<img class="card-image" src="${displayImg}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` : ''}
        <div class="card-image-placeholder" style="${displayImg ? 'display:none' : 'display:flex'}">📰</div>
        <div class="card-content">
          <span class="card-tag tag-news">${item.icon || '📰'} ${item.source}</span>
          <div class="card-title">${item.title}</div>
          <div class="card-meta"><span class="card-source">${item.source}</span><span>${formatDate(item.pubDate)}</span></div>
        </div>
      </div>
    `;
  }).join('');
}

// ========== 加载资讯 ==========
async function loadNews(btn) {
  const container = document.getElementById('news-cards');
  if (btn) btn.classList.add('loading');
  renderSkeleton(container, 6);
  
  try {
    const sources = [
      { url: 'https://www.ithome.com/rss/', name: 'IT之家', icon: '💻' },
      { url: 'https://sspai.com/feed', name: '少数派', icon: '✨' }
    ];
    const allItems = [];
    for (const source of sources) {
      try {
        const res = await withTimeout(fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`));
        const data = await res.json();
        if (data.status === 'ok' && data.items) {
          data.items.forEach(item => allItems.push({ ...item, source: source.name, icon: source.icon, sourceUrl: source.url }));
        }
      } catch (e) { console.warn(`${source.name} 失败:`, e.message); }
    }
    if (allItems.length > 0) {
      currentNewsItems = allItems;
      renderNewsCards(allItems);
    } else {
      throw new Error('所有源均失败');
    }
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
  } finally {
    if (btn) btn.classList.remove('loading');
    updateTime();
  }
}

// ========== 加载动漫 ==========
let currentAnimeType = 'season';

document.querySelectorAll('.sub-nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sub-nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAnimeType = btn.dataset.type;
    loadAnime();
  });
});

async function loadAnime(btn) {
  const container = document.getElementById('anime-cards');
  if (btn) btn.classList.add('loading');
  renderSkeleton(container, 6, 'anime');
  
  try {
    let url = '';
    if (currentAnimeType === 'season') {
      url = 'https://api.jikan.moe/v4/seasons/now?limit=12';
    } else if (currentAnimeType === 'top') {
      url = 'https://api.jikan.moe/v4/top/anime?limit=12';
    } else {
      // 随机推荐：调用12次random/anime获取真正随机的动漫
      const promises = Array(12).fill(null).map(() => 
        withTimeout(fetch('https://api.jikan.moe/v4/random/anime'), 10000)
          .then(r => r.json())
          .then(d => d.data)
          .catch(() => null)
      );
      const results = await Promise.allSettled(promises);
      const randomList = results.map(r => r.status === 'fulfilled' ? r.value : null).filter(Boolean);
      if (randomList.length > 0) {
        container.innerHTML = randomList.map((a, i) => `
          <div class="anime-card" onclick="window.open('${a.url}', '_blank')" style="animation-delay: ${i * 0.05}s">
            <span class="anime-rank">🎲</span>
            <img class="anime-cover" src="${a.images?.jpg?.large_image_url || ''}" alt="${a.title}" onerror="this.style.background='linear-gradient(135deg,var(--accent),var(--accent3))';">
            <div class="anime-overlay">
              <div class="anime-title">${a.title}</div>
              <div class="anime-meta"><span>⭐ ${a.score || '-'}</span><span>${a.type || ''}</span></div>
            </div>
            <div class="anime-info">
              <div class="anime-title">${a.title}</div>
              <div class="anime-meta"><span class="anime-rating">⭐ ${a.score || '-'}</span></div>
            </div>
          </div>
        `).join('');
        if (btn) btn.classList.remove('loading');
        return;
      }
      throw new Error('随机推荐失败');
    }
    
    const res = await withTimeout(fetch(url), 15000);
    const data = await res.json();
    if (data.data && data.data.length > 0) {
      container.innerHTML = data.data.map((a, i) => `
        <div class="anime-card" onclick="window.open('${a.url}', '_blank')" style="animation-delay: ${i * 0.05}s">
          <span class="anime-rank">#${i + 1}</span>
          <img class="anime-cover" src="${a.images?.jpg?.large_image_url || ''}" alt="${a.title}" onerror="this.style.background='linear-gradient(135deg,var(--accent),var(--accent3))';">
          <div class="anime-overlay">
            <div class="anime-title">${a.title}</div>
            <div class="anime-meta"><span>⭐ ${a.score || '-'}</span><span>${a.type || ''}</span></div>
          </div>
          <div class="anime-info">
            <div class="anime-title">${a.title}</div>
            <div class="anime-meta"><span class="anime-rating">⭐ ${a.score || '-'}</span></div>
          </div>
        </div>
      `).join('');
    } else {
      throw new Error('无数据');
    }
  } catch (e) {
    container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
  } finally {
    if (btn) btn.classList.remove('loading');
  }
}

// ========== 更新时间 ==========
function updateTime() {
  const now = new Date();
  document.getElementById('update-time').textContent = 
    now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
}

setInterval(updateTime, 60000);
updateTime();

// ========== 初始化加载 ==========
loadNews();
loadTech();
loadAnime();
</script>
